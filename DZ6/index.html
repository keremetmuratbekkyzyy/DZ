<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Slider</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="slider">

        <div class="slide active" role="button" tabindex="0" aria-expanded="true" aria-label="Луга">
            <img src="images/image1.png" alt="Луга">

            <div class="slide-info">
                <div class="icon" aria-hidden="true">🚶</div>
                <span>Луга</span>
            </div>
        </div>

        <div class="slide" role="button" tabindex="0" aria-expanded="false" aria-label="Вода">
            <img src="images/image2.png" alt="Вода">

            <div class="slide-info">
                <div class="icon" aria-hidden="true">💧</div>
                <span>Вода</span>
            </div>
        </div>

        <div class="slide" role="button" tabindex="0" aria-expanded="false" aria-label="Зима">
            <img src="images/image3.png" alt="Зима">

            <div class="slide-info">
                <div class="icon" aria-hidden="true">❄</div>
                <span>Зима</span>
            </div>
        </div>

        <div class="slide" role="button" tabindex="0" aria-expanded="false" aria-label="Горы">
            <img src="images/image4.png" alt="Горы">

            <div class="slide-info">
                <div class="icon" aria-hidden="true">🏔️</div>
                <span>Горы</span>
            </div>
        </div>

        <div class="slide" role="button" tabindex="0" aria-expanded="false" aria-label="Город">
            <img src="images/image5.png" alt="Город">

            <div class="slide-info">
                <div class="icon" aria-hidden="true">🏙️</div>
                <span>Город</span>
            </div>
        </div>

    </div>

    <script src="app.js"></script>

</body>

</html>
