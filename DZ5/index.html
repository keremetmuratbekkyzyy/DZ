<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title> Clicker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game">

        <div class="coins">
            <div class="coin-icon">
                <img src="images/coins.png" alt="Монета">
            </div>
            <span id="coins">0</span>
        </div>

        <button class="cat-button" id="catButton">
            <img src="images/cat.png" alt="Котик">
        </button>

        <div class="energy">
            <div class="energy-icon">
                 <img src="images/energy.png" alt="Энергия">
            </div>
            <span id="energy">200</span>
        </div>

    </div>


    <script src="app.js"></script>

</body>

</html>
